# dev-shared's own CI. Minimal + direct: this repo has no Rust crate to gate,
# and calling its own reusable rust-devenv-ci.yml would be circular (that
# workflow runs `devenv tasks run ci`, a consumer concern) AND would hard-fail
# (dev-shared defines only the namespaced ci:* lint tasks, no aggregate). So
# lint what this repo actually ships — workflows, Markdown, and the Nix module
# (nixfmt + deadnix, since devenv.nix is the module every consumer inherits).
name: ci

on:
  pull_request:

permissions:
  contents: read
  id-token: write # DeterminateSystems/determinate-nix-action needs OIDC

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./setup-devenv
      - name: actionlint
        run: devenv shell -- actionlint
      - name: markdownlint
        run: devenv shell -- markdownlint-cli2 "**/*.md"
      - name: nixfmt check
        run: devenv shell -- bash -c 'find . -maxdepth 1 -name "*.nix" -print0 | xargs -0 nixfmt --check'
      - name: deadnix
        run: devenv shell -- bash -c 'find . -maxdepth 1 -name "*.nix" -print0 | xargs -0 deadnix --fail'

  # The release driver is a bun/TypeScript project, gated on its own rather
  # than as a devenv ci:* task: those tasks are the shared lint set every
  # consumer inherits, and a consumer has no release/ directory to run them
  # against. Plain setup-bun, no devenv — nothing here needs the Nix shell.
  release-driver:
    name: release driver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: release
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install
        run: bun install --frozen-lockfile
      # Explicit node_modules paths, not `bunx <name>`: bunx falls back to
      # the registry when a local binary is missing, and the bare name
      # `biome` there is an unrelated package that exits 0 without checking.
      - name: biome
        run: ./node_modules/.bin/biome check .
      - name: typecheck
        run: ./node_modules/.bin/tsc --noEmit
      - name: test
        run: bun test
