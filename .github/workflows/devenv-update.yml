# Weekly devenv.lock update PR (hosted Renovate cannot read devenv.lock).
# Opened with a GitHub App token so CI runs on it; consumer wiring is in README.md.
name: devenv-update

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID of the GitHub App that opens the PR.
        type: string
        required: true
    secrets:
      DEVENV_UPDATE_APP_PRIVATE_KEY:
        required: true

jobs:
  update:
    name: devenv update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id || vars.DEVENV_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEVENV_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
      - uses: mattwilkinsonn/dev-shared/setup-devenv@v1
      - name: devenv update
        run: devenv update
      # The shell warm-up installs the repo's pre-push hook, whose runner is not
      # on the step PATH; the PR's own CI runs that gate instead.
      - name: Disable git hooks for the bot push
        run: git config --local core.hooksPath /dev/null
      - name: Open PR with the lock diff
        # SHA-pinned: it runs with the App's write token. Renovate tracks the comment.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(devenv): update devenv.lock inputs"
          title: "chore(devenv): update devenv.lock inputs"
          body: |
            Scheduled `devenv update` — refreshes the devenv.lock inputs
            (rolling nixpkgs, rust-overlay, and any other locked inputs) that
            hosted Renovate's `nix` manager cannot track.

            If a `rust-toolchain` bump PR is red because the locked rust-overlay
            rev predates the new channel manifest, merge this PR first.
          # Explicit base so a consumer invoking this reusable workflow from a
          # non-default ref still targets main, not the checked-out ref.
          base: main
          branch: devenv-update
          delete-branch: true
